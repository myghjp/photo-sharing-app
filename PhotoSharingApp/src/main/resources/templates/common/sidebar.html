<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}"
	>
<head>
<meta charset="UTF-8">
</head>

<body>
	<div layout:fragment="sidebar" class="p-3">
		<div class="text-center">
			<div th:text="${group.groupName}" class="fs-4 fw-bold"></div>
			<th:block th:if="${isAdmin}">
				<div th:text="#{adminInfo}" class="text-info fs-5"></div>
			</th:block>
		</div>
		<hr>
		<ul class="nav nav-pills flex-column mb-auto">
			<li class="nav-item">
				<a th:href="@{'/dashboard'}" th:text="#{groupInfoPage}" class="nav-link" 
					th:classappend="${currentURL == '/dashboard'} ? 'active' : ''" aria-current="page">
				</a>
			</li>
			<li class="nav-item">
				<a th:href="@{'/member/list'}" th:text="#{listMemberPage}" class="nav-link"
					th:classappend="${currentURL == '/member/list'} ? 'active' : ''" aria-current="page">
				</a>
			</li>
			<li class="nav-item">
				<a th:href="@{'/album/list'}" th:text="#{listAlbumPage}" class="nav-link"
					th:classappend="${(currentURL == '/album/list' ? 'active' : '') 
					+ (currentURL == '/album/photo/list' ? 'active' : '')}|" aria-current="page">
				</a>
			</li>
			<li class="nav-item">
				<a th:href="@{'/comment/list'}" th:text="#{listCommentPage}" class="nav-link"
					th:classappend="${currentURL == '/comment/list'} ? 'active' : ''" aria-current="page">
				</a>
			</li>
		</ul>
		<hr>
	</div>
</body>
</html>
